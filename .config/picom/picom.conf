# =============================================================================
# Picom Config — Blur + Şeffaflık
# =============================================================================

# =============================================================================
# Backend
# =============================================================================
backend = "glx";
vsync = true;
use-damage = true;

# =============================================================================
# Gölgeler
# =============================================================================
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.75;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'i3-frame'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# =============================================================================
# Blur
# =============================================================================
blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'i3lock'"
];

# =============================================================================
# Şeffaflık (Opacity)
# =============================================================================
active-opacity = 1.0;
inactive-opacity = 0.92;
frame-opacity = 0.9;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'mpv'",
    "100:class_g = 'vlc'",
    "95:class_g  = 'Alacritty' && focused",
    "88:class_g  = 'Alacritty' && !focused",
    "100:class_g = 'i3lock'"
];

# =============================================================================
# Fading (Geçiş Animasyonu)
# =============================================================================
fading = true;
fade-in-step  = 0.03;
fade-out-step = 0.03;
fade-delta    = 5;

fade-exclude = [];

# =============================================================================
# Köşe Yuvarlama
# =============================================================================
corner-radius = 8;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# =============================================================================
# Diğer
# =============================================================================
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";
